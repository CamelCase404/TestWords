<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Орфографический тренажер ЕГЭ: Premium Strict</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app-container" id="main-container">
            <div class="top-decorative-line"></div>

            <div class="brand-header">
                <h1>Орфографический тренажер</h1>
                <div class="subtitle">ЕГЭ Русский язык • Навигатор ФИПИ</div>
                <a
                    href="dictionary.html"
                    class="btn btn-dark"
                    style="
                        margin-top: 15px;
                        display: inline-block;
                        width: auto;
                        font-size: 12px;
                        padding: 12px 24px;
                        text-decoration: none;
                    "
                    >Открыть полный словарь (А — Э)</a
                >
            </div>

            <!-- ЭКРАН 1: Настройки сессии -->
            <div id="start-screen" class="screen">
                <div class="config-panel">
                    <div class="panel-section">
                        <div class="config-row">
                            <div class="config-group">
                                <label for="filter-from">Диапазон от:</label>
                                <input
                                    type="text"
                                    id="filter-from"
                                    class="form-control text-center"
                                    placeholder="А"
                                    maxlength="1"
                                    value="а"
                                />
                            </div>
                            <div class="config-group">
                                <label for="filter-to">Диапазон до:</label>
                                <input
                                    type="text"
                                    id="filter-to"
                                    class="form-control text-center"
                                    placeholder="П"
                                    maxlength="1"
                                    value="э"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <div class="config-group">
                            <label for="filter-priority"
                                >Приоритетная буква корня:</label
                            >
                            <input
                                type="text"
                                id="filter-priority"
                                class="form-control"
                                placeholder="Введите одну букву (например, П)"
                                maxlength="1"
                            />
                        </div>
                    </div>

                    <div class="panel-section">
                        <div class="config-group">
                            <label for="filter-type">Тип орфограммы:</label>
                            <div class="custom-select-wrapper">
                                <select id="filter-type" class="form-control">
                                    <option value="any">
                                        Все типы гласных и согласных
                                    </option>
                                    <option value="о-а">Пропуски О / А</option>
                                    <option value="е-и">Пропуски Е / И</option>
                                    <option value="double">
                                        Удвоенные буквы
                                    </option>
                                    <option value="sh">
                                        Шипящие и исключения (ЖЮ/ШЮ/О/Ё)
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="generateSession()">
                    Запустить тест
                </button>

                <!-- НОВЫЙ БЛОК: Таблица лучших прохождений -->
                <div class="panel-section" style="margin-top: 25px">
                    <div class="config-group">
                        <label
                            style="
                                margin-bottom: 8px;
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                            "
                        >
                            <span>🏆 Топ лучших результатов:</span>
                            <span
                                style="
                                    cursor: pointer;
                                    text-transform: none;
                                    font-weight: normal;
                                    text-decoration: underline;
                                "
                                onclick="clearLeaderboard()"
                                >очистить</span
                            >
                        </label>
                        <div id="leaderboard-container">
                            <!-- Сюда leaderboard.js вставит список лучших результатов -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- ЭКРАН 2: Игровой процесс -->
            <div id="game-screen" class="screen hidden">
                <div class="top-meta-row">
                    <div class="stat-badge">
                        Баллы: <span id="score-points">0</span>
                    </div>
                    <div class="stat-badge error-badge">
                        <span>Жизни:</span>
                        <div class="lives-container" id="lives-container"></div>
                    </div>
                </div>

                <div class="timeline-container">
                    <div id="timeline-indicator" class="timeline-bar"></div>
                </div>

                <div class="game-layout">
                    <div class="side-column">
                        <div class="drop-zone" id="zone-0"></div>
                        <div class="drop-zone" id="zone-1"></div>
                    </div>

                    <div class="center-column">
                        <div class="source-zone" id="source-container">
                            <div id="draggable-word" class="word-card"></div>
                        </div>
                        <div id="context-display" class="context-box"></div>
                    </div>

                    <div class="side-column">
                        <div class="drop-zone" id="zone-2"></div>
                        <div class="drop-zone" id="zone-3"></div>
                    </div>
                </div>

                <div id="feedback-modal" class="modal hidden">
                    <div class="modal-content">
                        <div id="modal-status"></div>
                        <div id="modal-text"></div>
                        <div id="modal-rule" class="rule-text"></div>
                        <button
                            id="next-btn"
                            class="btn btn-dark"
                            onclick="nextQuestion()"
                        >
                            Продолжить
                        </button>
                    </div>
                </div>
            </div>

            <!-- ЭКРАН 3: Итоги -->
            <div id="result-screen" class="screen hidden">
                <h2 id="result-title">Тест завершен</h2>
                <p class="final-score-text" style="font-size: 18px">
                    Итоговый счет:
                    <strong id="final-points" style="font-size: 24px">0</strong>
                    баллов
                </p>

                <div id="analytics-section" class="hidden">
                    <h4 class="error-heading">
                        Рекомендуем повторить (Ошибки и задержки мышления):
                    </h4>
                    <div class="results-list" id="analytics-list"></div>
                </div>

                <button
                    class="btn btn-primary"
                    style="margin-top: 25px"
                    onclick="backToMenu()"
                >
                    Вернуться в меню
                </button>
            </div>
        </div>

        <script src="words.js"></script>
        <script src="leaderboard.js"></script>
        <!-- Подключается строго перед app.js -->
        <script src="app.js"></script>
    </body>
</html>
